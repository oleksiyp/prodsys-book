<div class="dg-figure" data-fig="fig-15-5" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 424" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-15-5-title fig-15-5-desc">
<title id="fig-15-5-title">The added dates&#x27; Friday morning</title>
<desc id="fig-15-5-desc">A timeline of the Friday, with the morning before 10:00 compressed: curtain-up at 07:30, the freeze at 08:00 with two exceptions registered, and at 09:40 a pre-warm check that timed out and was rerun by hand. From 10:00 the Gate is open; at 10:09 a Dutch bank&#x27;s card authentication slows, the slow burn-rate alert fires and the commander decides not to act; the window&#x27;s error budget spent climbs to about 22%, and all four dates sell out within the hour.</desc>
