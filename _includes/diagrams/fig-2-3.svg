<div class="dg-figure" data-fig="fig-2-3" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 412" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-2-3-title fig-2-3-desc">
<title id="fig-2-3-title">Rasmussen&#x27;s drifting operating point</title>
<desc id="fig-2-3-desc">Rasmussen&#x27;s model of work in a space bounded by economic failure (upper left), unacceptable workload (lower left) and functionally acceptable performance (right). Management pressure toward efficiency and the gradient toward least effort both push the operating point to the right; it wanders like a particle in random motion but travels steadily toward the safety boundary, which is invisible from inside daily work and lies beyond where people believe it is.</desc>
