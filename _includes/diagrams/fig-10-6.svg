<div class="dg-figure" data-fig="fig-10-6" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-10-6-title fig-10-6-desc">
<title id="fig-10-6-title">The region failover game day</title>
<desc id="fig-10-6-desc">Every event homed in EU-1 is failed over to EU-2. The core held: Seat Inventory standbys were promoted in about four minutes and fencing rejected late writes from EU-1 leaders. Three edges did not: the Sale Gate was pre-warmed only in EU-1, Bot Screening&#x27;s risk data reached EU-2 only by a daily copy, and an Orders reconciliation job whose schedule named EU-1 sat idle for six hours.</desc>
