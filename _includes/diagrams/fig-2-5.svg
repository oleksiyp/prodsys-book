<title id="fig-2-5-title">Above and below the line</title>
<desc id="fig-2-5-desc">After the STELLA report (2017). Encore&#x27;s people sit above the line of representation, each with a partial mental model. Below it sit the services, clusters and the payment provider, which nobody sees directly. Between them are the representations (dashboards, alerts, traces, deploy tools) through which people see the system and act on it.</desc>
