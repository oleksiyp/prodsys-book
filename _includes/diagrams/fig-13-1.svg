<div class="dg-figure" data-fig="fig-13-1" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 464" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-13-1-title fig-13-1-desc">
<title id="fig-13-1-title">The control structure of the Vesper Hale on-sale</title>
<desc id="fig-13-1-desc">A CAST control structure: the readiness review and freeze exempt the node-upgrade reconciler and leave Catalog out of scope; the reconciler, the On-Sale team, the Catalog team and the Bot Screening rule each act on the purchase path; Cue advises the incident commander. Two feedback paths are missing: the reconciler never reads the on-sale calendar, and the bot rule never sees purchase-path error rates.</desc>
