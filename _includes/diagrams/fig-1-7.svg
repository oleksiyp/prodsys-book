<div class="dg-figure" data-fig="fig-1-7" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 396" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-1-7-title fig-1-7-desc">
<title id="fig-1-7-title">Two ways to raise availability</title>
<desc id="fig-1-7-desc">Availability equals mean time between failures divided by the sum of that and mean time to repair. Lines of equal availability (99.9%, 99.95%, 99.99%) fan out from the origin. A service that fails once a month and takes 43 minutes to recover sits at 99.9%; it reaches 99.95% either by failing half as often or by recovering twice as fast.</desc>
