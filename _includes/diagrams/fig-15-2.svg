<div class="dg-figure" data-fig="fig-15-2" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-15-2-title fig-15-2-desc">
<title id="fig-15-2-title">SRE team models: context against reach</title>
<desc id="fig-15-2-desc">A chart with reach, the number of teams a reliability engineer touches, across, and context, depth of knowledge of one system, up. Embedded sits high on context and low on reach; central and platform-aligned sit in the middle; consulting reaches far with little context. The four lie near a trade-off line; a hybrid with champions in every team aims above it, where Encore&#x27;s arrangement now sits.</desc>
