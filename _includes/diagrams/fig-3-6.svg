<div class="dg-figure" data-fig="fig-3-6" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 412" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-3-6-title fig-3-6-desc">
<title id="fig-3-6-title">Calibrated trust</title>
<desc id="fig-3-6-desc">After Lee and See (2004). Trust in automation plotted against its actual capability. On the diagonal, trust matches capability. Above it lies overtrust, which leads to misuse, such as approving curtain-up&#x27;s plan unread; below it lies distrust, which leads to disuse, such as muting an alert channel that cried wolf.</desc>
