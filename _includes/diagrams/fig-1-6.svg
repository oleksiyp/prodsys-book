<div class="dg-figure" data-fig="fig-1-6" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 344" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-1-6-title fig-1-6-desc">
<title id="fig-1-6-title">Who runs the software, 1945 to today</title>
<desc id="fig-1-6-desc">A timeline of running software: the computer operator of the closed shop from the 1950s, the system administrator from the 1980s, site reliability engineering and DevOps from 2003 and 2009, and today coding agents as authors. Events marked: the 1947 Mark II logbook, GM-NAA I/O in 1956, System/360 in 1964, ITIL in the late 1980s, Google&#x27;s first SRE team in 2003, Flickr and the first DevOpsDays in 2009, and coding agents today.</desc>
