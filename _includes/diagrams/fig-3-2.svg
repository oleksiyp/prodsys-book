<div class="dg-figure" data-fig="fig-3-2" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 384" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-3-2-title fig-3-2-desc">
<title id="fig-3-2-title">What the pre-warm costs a year</title>
<desc id="fig-3-2-desc">Engineer-hours per year spent on the on-sale pre-warm against the number of on-sales a year. The wiki page took 70 to 120 minutes each time, so at 160 on-sales it cost roughly 190 to 320 hours. The script cut that to about 12 minutes, 32 hours; curtain-up needs about 5 minutes of review, some 13 hours. Every generation still grows with the number of on-sales.</desc>
