<div class="dg-figure" data-fig="fig-5-1" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 408" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-5-1-title fig-5-1-desc">
<title id="fig-5-1-title">Encore&#x27;s telemetry pipeline</title>
<desc id="fig-5-1-desc">Gate functions, Kubernetes services and the service mesh emit telemetry through OpenTelemetry SDKs to agent collectors, which batch and forward it, keyed by trace ID, to a gateway tier. The gateway redacts what must not be stored, routes security events to their own account and tail-samples traces, keeping errors, checkouts slower than 2 s and a 10% baseline. Metrics are kept 13 months, wide events 14 days and sampled traces 30 days.</desc>
