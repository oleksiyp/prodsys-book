<div class="dg-figure" data-fig="fig-2-2" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 364" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-2-2-title fig-2-2-desc">
<title id="fig-2-2-title">The retry storm through the cheese</title>
<desc id="fig-2-2-desc">Reason&#x27;s Swiss cheese model applied to Encore&#x27;s first big outage. A slow payment provider is the trigger; four defenses stand between it and the fans: retries, connection pools, health checks and the autoscaler. Each has holes left by latent conditions set far from the sharp end, and on the day they lined up, letting the slowdown through to an outage of the purchase path.</desc>
