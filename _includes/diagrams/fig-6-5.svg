<rect class="dg-mask" x="108" y="32" width="184" height="12" rx="2"/><text class="dg-label" x="200" y="41">WORKS EVEN WHEN NOBODY REMEMBERS</text>
<rect class="dg-mask" x="110" y="352" width="180" height="12" rx="2"/><text class="dg-label dg-l-accent" x="200" y="361">WORKS ONLY IF SOMEONE REMEMBERS</text>
<text class="dg-name" x="200" y="82">Eliminate</text>
<text class="dg-name" x="200" y="142">Substitute</text>
<text class="dg-name" x="200" y="202">Engineer</text>
<text class="dg-name" x="200" y="262">Procedure</text>
<text class="dg-name" x="200" y="322">Remind</text>
<text class="dg-note" x="400" y="75">Nodes hosting shard leaders are never drained during a sale</text>
<text class="dg-note" x="400" y="89">(the hazard is gone, whoever is on call)</text>
<text class="dg-note" x="400" y="135">Freeze scope derived from the traced dependency graph,</text>
<text class="dg-note" x="400" y="149">not a hand-kept list of services</text>
<text class="dg-note" x="400" y="195">Reconciler reads the calendar and holds from T−2h; cold-cache</text>
<text class="dg-note" x="400" y="209">test gates admission changes; bot rule drops to observe-only</text>
<text class="dg-note" x="400" y="255">Exception register reviewed monthly; readiness review asks</text>
<text class="dg-note" x="400" y="269">about cache state; every bot rule has an owner and a review date</text>
<text class="dg-note" x="400" y="315">“Remind engineers to check cache state”</text>
<text class="dg-note" x="400" y="329">a wish, not a control</text>
<line class="dg-rule" x1="24" y1="372" x2="840" y2="372"/>
<rect class="dg-n dg-n-backend" x="24" y="383" width="16" height="10" rx="2"/>
<text class="dg-legend" x="46" y="391">Kind of remedy, most reliable at the top</text>
<rect class="dg-n dg-n-focal" x="298" y="383" width="16" height="10" rx="2"/>
<text class="dg-legend" x="320" y="391">Depends on someone remembering</text>
