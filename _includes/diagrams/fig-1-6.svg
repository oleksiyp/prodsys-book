<text class="dg-eyebrow" x="48" y="48" style="text-anchor:start">WHO STANDS BETWEEN THE CODE AND ITS USERS</text>
<text class="dg-label" x="68" y="296" style="text-anchor:start">1947</text>
<text class="dg-note" x="68" y="309" text-anchor="start">Mark II logbook:</text>
<text class="dg-note" x="68" y="321" text-anchor="start">the first bug, taped in</text>
<text class="dg-label" x="149" y="248" style="text-anchor:start">1956</text>
<text class="dg-note" x="149" y="261" text-anchor="start">GM-NAA I/O cuts</text>
<text class="dg-note" x="149" y="273" text-anchor="start">setup time between jobs</text>
<text class="dg-label" x="221" y="200" style="text-anchor:start">1964</text>
<text class="dg-note" x="221" y="213" text-anchor="start">IBM System/360</text>
<text class="dg-note" x="221" y="225" text-anchor="start">spreads the operator&#x27;s job</text>
<text class="dg-label" x="446" y="200" style="text-anchor:start">LATE 1980S</text>
<text class="dg-note" x="446" y="213" text-anchor="start">ITIL: change boards,</text>
<text class="dg-note" x="446" y="225" text-anchor="start">and the wall between</text>
<text class="dg-label" x="572" y="296" style="text-anchor:start">2003</text>
<text class="dg-note" x="572" y="309" text-anchor="start">Google&#x27;s first SRE team,</text>
<text class="dg-note" x="572" y="321" text-anchor="start">seven engineers</text>
<text class="dg-label" x="626" y="248" style="text-anchor:start">2009</text>
<text class="dg-note" x="626" y="261" text-anchor="start">Flickr&#x27;s 10 deploys a day;</text>
<text class="dg-note" x="626" y="273" text-anchor="start">first DevOpsDays, Ghent</text>
