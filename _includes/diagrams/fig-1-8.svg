<div class="dg-figure" data-fig="fig-1-8" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 452" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-1-8-title fig-1-8-desc">
<title id="fig-1-8-title">One bad minute crosses the stack</title>
<desc id="fig-1-8-desc">Six layers of Encore&#x27;s production stack as horizontal bands. A node drain in the runtime appears as a latency spike in telemetry, a burning error budget in the SLO layer, a page and an incident, a review in learning, and finally a change shipped through delivery. Each layer sees only its own part of the event.</desc>
