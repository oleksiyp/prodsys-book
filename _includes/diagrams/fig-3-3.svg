<div class="dg-figure" data-fig="fig-3-3" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 388" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-3-3-title fig-3-3-desc">
<title id="fig-3-3-title">The failover nobody has practiced</title>
<desc id="fig-3-3-desc">An illustrative curve of readiness to perform Seat Inventory&#x27;s manual failover. It decays for the 19 months after the last manual failover in production, while about 60 automatic failovers succeed without exercising the manual path. When the Reliability team checks, 4 of 34 engineers have ever done it. Monthly drills then hold readiness up in a sawtooth; the first drill finds two stale commands.</desc>
