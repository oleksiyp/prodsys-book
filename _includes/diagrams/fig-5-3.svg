<div class="dg-figure" data-fig="fig-5-3" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-5-3-title fig-5-3-desc">
<title id="fig-5-3-title">Roles and lines of communication at Vesper Hale</title>
<desc id="fig-5-3-desc">Marta, the incident commander, directs three roles: Rui as ops lead, with Jonas of Seat Inventory and Noor of Bot Screening under him; a scribe keeping the log, with Cue drafting the timeline; and Elif as comms lead. Elif speaks outward to fans through the status page and upward to stakeholders, and at 10:24 carried Support&#x27;s report inward, that fans were being told they were bots.</desc>
