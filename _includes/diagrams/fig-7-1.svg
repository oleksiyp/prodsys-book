<div class="dg-figure" data-fig="fig-7-1" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 372" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-7-1-title fig-7-1-desc">
<title id="fig-7-1-title">Three governors on one lever</title>
<desc id="fig-7-1-desc">A sketch of Catalog&#x27;s replica count over half an hour. An engineer scales it from 20 to 60; within a minute the GitOps agent restores the manifest&#x27;s 20; the autoscaler then trims the idle pods toward its floor of 12, and the GitOps agent resets them to 20 again, drawing a sawtooth while the engineer believes the service is at 60.</desc>
