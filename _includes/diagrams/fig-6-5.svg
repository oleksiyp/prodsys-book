<div class="dg-figure" data-fig="fig-6-5" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 412" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-6-5-title fig-6-5-desc">
<title id="fig-6-5-title">The hierarchy of controls at Encore</title>
<desc id="fig-6-5-desc">An inverted pyramid of five kinds of remedy, from the most reliable at the top to the least at the bottom: eliminate the hazard, substitute something safer, engineer a barrier, add procedure and training, and remind people. Beside each level sits the Encore change from the Vesper Hale review that belongs there; the bottom level holds a reminder, which is a wish.</desc>
